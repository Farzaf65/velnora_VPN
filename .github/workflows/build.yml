name: Build Velnora APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Find project zip
        id: chk
        run: |
          ZIP=""
          if [ -f velnora.zip ]; then ZIP=velnora.zip; elif [ -f project.zip ]; then ZIP=project.zip; fi
          if [ -z "$ZIP" ]; then
            echo "No velnora.zip in repo root yet, nothing to build"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building from $ZIP"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          fi

      - name: Unpack project
        if: steps.chk.outputs.ok == 'true'
        run: |
          rm -rf _p && mkdir _p
          unzip -q "$ZIP" -d _p
          SET=$(find _p -name settings.gradle.kts | head -1)
          if [ -z "$SET" ]; then echo "settings.gradle.kts not found inside zip"; find _p | head -50; exit 1; fi
          echo "PROJ=$(dirname "$SET")" >> "$GITHUB_ENV"

      - name: Set up Java
        if: steps.chk.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.chk.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing key
        if: steps.chk.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "Signing key found: building a signed release APK"
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "No signing key set: building a debug APK"
          fi

      - name: Build APK (with the OpenVPN engine first, plain UI build if the engine fails)
        if: steps.chk.outputs.ok == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +e
          if [ "$BUILD_TYPE" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ENGINE_OK=0
          if [ -f no-engine.txt ]; then
            echo "no-engine.txt found: skipping the engine"
          else
            echo "Step 1: trying to build with the OpenVPN engine"
            git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/eduvpn/ics-openvpn.git "$PROJ/ics-openvpn" > engine-clone.log 2>&1
            if [ $? -ne 0 ]; then
              echo "::warning::Engine download failed"; tail -5 engine-clone.log
            else
              python3 "$PROJ/engine-prep.py" "$PROJ" > engine-prep.log 2>&1
              cat engine-prep.log
              SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
              yes | "$SDKM" --licenses > /dev/null 2>&1
              "$SDKM" "ndk;28.0.13004108" "cmake;3.22.1" > /dev/null 2>&1
              if [ -f "$PROJ/ndk.txt" ]; then "$SDKM" "ndk;$(cat "$PROJ/ndk.txt")" > /dev/null 2>&1; fi
              GR="gradle"
              if [ -f "$PROJ/gradlew" ]; then chmod +x "$PROJ/gradlew"; GR="$PROJ/gradlew"; fi
              echo "Engine build uses: $GR"
              $GR -p "$PROJ" ":ics-openvpn:velnora:$TASK" -Pengine=on --no-daemon --console=plain > build-engine.log 2>&1
              if [ $? -eq 0 ]; then
                ENGINE_OK=1
              else
                echo "::warning::ENGINE BUILD FAILED - the lines below are what to send me"
                grep "^INFO" engine-prep.log | while IFS= read -r l; do echo "::warning::$l"; done
                grep -E "^e: |error:|What went wrong" -A3 build-engine.log | head -40 | while IFS= read -r l; do echo "::warning::$l"; done
                tail -40 build-engine.log
              fi
            fi
          fi
          if [ $ENGINE_OK -eq 1 ]; then
            echo "::notice::Built WITH the OpenVPN engine"
            echo "ENGINE=on" >> "$GITHUB_ENV"
          else
            echo "Step 2: building the app without the engine"
            for f in build.gradle.kts app/build.gradle.kts; do if [ -f "$PROJ/$f.orig" ]; then cp "$PROJ/$f.orig" "$PROJ/$f"; fi; done
            rm -rf "$PROJ/gradle" "$PROJ/gradlew" "$PROJ/gradlew.bat" "$PROJ/app/build"
            gradle -p "$PROJ" $TASK --no-daemon --console=plain > build.log 2>&1
            RC=$?
            if [ $RC -ne 0 ]; then
              grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
              tail -60 build.log
              exit $RC
            fi
            echo "::notice::Built WITHOUT the engine (screens only, the Connect button cannot open a tunnel)"
            echo "ENGINE=off" >> "$GITHUB_ENV"
          fi

      - name: Collect APK
        if: steps.chk.outputs.ok == 'true'
        run: |
          mkdir -p out
          cp "$PROJ"/app/build/outputs/apk/$BUILD_TYPE/*.apk out/Velnora.apk

      - name: Upload APK
        if: steps.chk.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Velnora-apk
          path: out/Velnora.apk
